<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f2e8d5"><title>Project Duet</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/dev-controller.js" defer></script><script src="/room.js"></script></head>
<body data-view="welcome">
<svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-settings" viewBox="0 0 32 32"><path d="m13 3 6 1 1 4 3 2 4-1 3 5-3 3-1 3 1 4-5 3-3-3-4 1-3 3-5-3 1-4-2-3-3-1 1-6 4-1 2-3z"/><path d="M20 12c-7-6-13 8-5 9 7 2 10-7 5-9z"/></symbol>

<symbol id="i-eraser" viewBox="0 0 32 32"><path d="m4 20 14-16 11 10-13 15-6-1zM11 12l11 10M16 29h13"/></symbol>
<symbol id="i-text" viewBox="0 0 32 32"><path d="m5 9 1-4 23 1v4M16 7l-1 20M10 28l11-1"/></symbol>
<symbol id="i-undo" viewBox="0 0 32 32"><path d="m12 6-8 8 10 5M5 14c21-9 28 11 13 13"/></symbol>
<symbol id="i-redo" viewBox="0 0 32 32"><path d="m20 6 8 8-10 5M27 14C6 5-1 25 14 27"/></symbol>

<symbol id="i-sound" viewBox="0 0 32 32"><path d="m4 12 6-1 8-7v24l-8-7-6-1zM23 11q6 5 0 10M27 6q9 10 0 20"/></symbol>
<symbol id="i-preview" viewBox="0 0 32 32"><path d="M2 16Q16-4 30 16 15 35 2 16z"/><path d="M21 15c-1-8-12-6-11 2s13 6 11-2z"/></symbol>
<symbol id="i-save" viewBox="0 0 32 32"><path d="m5 4 19 1 4 5-1 19-23-1zM10 5v8h12V6M9 28V18h13v10"/></symbol>
<symbol id="i-person" viewBox="0 0 32 32"><path d="M22 10c0 9-13 9-13 0S22 1 22 10zM4 29c0-15 24-15 24 0"/></symbol><symbol id="i-play" viewBox="0 0 32 32"><path d="m10 5 17 11-18 12z"/></symbol><symbol id="i-muted" viewBox="0 0 32 32"><path d="m3 12 6-1 8-7v24l-8-7-6-1zM23 12l7 9m0-9-7 9"/></symbol><symbol id="i-add-note" viewBox="0 0 32 32"><path d="M5 3 25 4 28 23 21 29 4 27zM21 29v-7l7 1M10 13h12M16 7v12"/></symbol><symbol id="i-download" viewBox="0 0 32 32"><path d="M16 4q1 8 0 16M9 14q7 7 7 7t7-7M5 27q11 2 22 0"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></symbol><symbol id="i-grip" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol></defs></svg>
<header class="site-header"><div class="day-clock" title="Asia/Kolkata"><svg viewBox="0 0 80 80" role="img" id="clock-face" aria-label="Clock"><path d="M40 4Q75 3 76 39T40 76Q4 77 4 40T40 4Z" fill="var(--cream)"/><g class="clock-numbers"><text x="40" y="18">12</text><text x="65" y="44">3</text><text x="40" y="68">6</text><text x="15" y="44">9</text></g><path id="hour-hand" d="M40 42 39 25"/><path id="minute-hand" d="M39 43 41 19"/><circle cx="40" cy="40" r="2" fill="currentColor"/></svg><time id="clock-date"></time></div><div class="top-actions"><span id="identity" hidden><span id="identity-label"></span><img id="identity-avatar" src="assets/portrait-cat.svg" alt=""></span><span id="streak" hidden role="status"><img src="assets/fire.svg" alt=""><strong id="streak-count">0</strong><span class="streak-contributions" aria-hidden="true"><i data-contributor="chat"></i><i data-contributor="aryan"></i></span></span><button id="switch" class="icon-button" title="Switch person" aria-label="Switch person" hidden><svg><use href="#i-switch"/></svg></button><button id="lock" class="icon-button" title="Lock the walls" aria-label="Lock the walls" hidden><svg><use href="#i-lock"/></svg></button><button id="settings-open" class="icon-button" title="Settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button></div><div class="brand-scene"><button class="wordmark" id="home" aria-label="Project Duet, home"><span class="project-word">PROJECT<img class="brand-cat" src="assets/cat.svg" alt=""></span> <span>DUET</span></button></div></header>
<main>
<div class="entry-backdrop" aria-hidden="true"><div class="entry-stars wb-stars"></div><div class="sky"></div><img class="clouds" src="assets/clouds.svg" alt=""><div class="ground-layer"><img class="meadow-hills" src="assets/meadow-hills.svg" alt=""><img class="meadow-sprig" src="assets/meadow-sprig.svg" alt=""></div><img class="entry-deer" src="assets/deer.svg" alt=""></div><div class="walls-bg" aria-hidden="true"><div class="wb-sky"></div><div class="wb-stars"></div><div class="wb-clouds a"></div><div class="wb-clouds b"></div><div class="wb-grain"></div><div class="wb-vig"></div><div class="wb-hills"><i class="back"></i><i></i><img class="s1" src="assets/meadow-sprig.svg" alt=""><img class="s2" src="assets/meadow-daisy.svg" alt=""><img class="s3" src="assets/meadow-bell.svg" alt=""><img class="s4" src="assets/meadow-tulip.svg" alt=""></div></div>
<section id="welcome" class="welcome"><div class="entry-scene"><form id="unlock" class="entry-paper"><img class="tape" src="assets/tape.svg" alt=""><label for="passphrase">PASSCODE</label><div class="pass-row"><input id="passphrase" name="passphrase" type="password" inputmode="numeric" autocomplete="current-password" maxlength="200" required aria-label="Passcode"><button class="icon-button enter-button" type="submit" aria-label="Enter"><svg><use href="#i-arrow"/></svg></button></div><p class="error" id="unlock-error" role="status"></p></form></div></section>
<section id="choose" class="choose" hidden><div class="choices"><button class="person-choice" data-person="chat"><img class="portrait" src="assets/portrait-deer.svg" alt=""><span>ChatChan</span><svg><use href="#i-arrow"/></svg></button><button class="person-choice" data-person="aryan"><img class="portrait" src="assets/portrait-cat.svg" alt=""><span>Aryan Chan</span><svg><use href="#i-arrow"/></svg></button></div><p id="choose-error" class="error" role="status"></p></section>
<section id="walls" hidden><div class="wall-top"><span id="connection" role="status"></span><button id="compose" class="paper-button primary"><span class="note-icon" aria-hidden="true"><svg class="note-flat"><use href="#i-add-note"/></svg><svg class="note-lift" viewBox="0 0 32 32"><path d="m7 4 17-1 1 17-8 8-13-3z"/><path d="m17 28 1-10 7 2-8 8" fill="#efd2bd"/><path d="M10 12h9m-5-5v10"/></svg></span><strong>Add a note</strong></button></div><nav class="mobile-tabs" aria-label="Choose wall"><button data-wall="chat">ChatChan</button><button data-wall="aryan">Aryan Chan</button></nav><div class="wall-grid"><section class="wall" data-owner="chat"><div class="wall-heading"><h1>ChatChan’s wall</h1><img src="assets/deer-seat.svg" alt="Sleeping deer on a grassy bank"></div><div class="notes" id="chat-notes"></div></section><section class="wall" data-owner="aryan"><div class="wall-heading"><h1>Aryan Chan’s wall</h1><img src="assets/cat-seat.svg" alt="Sleeping cat on a table beside a coffee mug"></div><div class="notes" id="aryan-notes"></div></section></div><button id="older" class="paper-button older" hidden>Older notes</button></section>
</main>
<dialog id="settings" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">SETTINGS</h2><button id="settings-close" class="icon-button" aria-label="Close settings"><svg><use href="#i-close"/></svg></button></div><div class="settings-tabs" role="tablist"><button role="tab" data-tab="sound" aria-selected="true" aria-controls="tab-sound">Sound</button><button role="tab" data-tab="export" aria-selected="false" aria-controls="tab-export">Export</button></div><div id="tab-sound" role="tabpanel"><div class="music-panel"><div class="music-caption"><span>Music</span><span id="track-name">Coffee</span></div><div class="music-buttons"><button id="mute" class="paper-button" aria-label="Play music"><svg id="music-icon"><use href="#i-play"/></svg><span id="music-label">Play</span></button><button id="next-track" class="icon-button" aria-label="Next track" title="Next track"><svg viewBox="0 0 32 32"><path d="m5 7 15 9-15 9zM25 6l-1 20"/></svg></button></div></div><label class="volume-label" for="volume">Volume <output id="volume-value">30%</output></label><input id="volume" type="range" min="0" max="100" value="30"></div><div id="tab-export" role="tabpanel" hidden><div class="export-walls" role="group" aria-label="Walls to export"><button data-export-wall="chat" aria-pressed="false" aria-label="ChatChan's wall" title="ChatChan's wall"><img src="assets/portrait-deer.svg" alt=""></button><button data-export-wall="aryan" aria-pressed="false" aria-label="Aryan Chan's wall" title="Aryan Chan's wall"><img src="assets/portrait-cat.svg" alt=""></button><button data-export-wall="both" class="both" aria-pressed="true" aria-label="Both walls" title="Both walls"><img src="assets/portrait-deer.svg" alt=""><img src="assets/portrait-cat.svg" alt=""></button></div><div class="setting-row export-row"><span>Notes<small>Text, drawings and details, as a zip</small></span><button id="export-notes" class="paper-button"><svg><use href="#i-download"/></svg><span>Save</span></button></div><div class="setting-row export-row"><span>Page<small>This view at the current time of day</small></span><button id="export-page" class="paper-button"><svg><use href="#i-download"/></svg><span>Save</span></button></div><p id="export-status" class="export-status" role="status"></p></div></dialog>

<dialog id="editor" aria-labelledby="editor-title">
<div class="ed-head"><button id="close-editor" class="icon-button" type="button" aria-label="Close editor and keep draft" title="Keep draft and close"><svg aria-hidden="true"><use href="#i-close"/></svg></button><h1 id="editor-title">On a wall</h1><p class="ed-status" id="draft-status" role="status">Draft saved on this device</p></div>
<div class="ed-body">
<div class="ed-rail" aria-label="Tools and options">
<div class="ed-tools" role="group" aria-label="Tools"><button type="button" class="ed-tool" data-tool="pencil" aria-pressed="false" title="Pencil (P)"><svg aria-hidden="true"><use href="#i-pencil"/></svg><span>Pencil</span></button><button type="button" class="ed-tool" data-tool="ink" aria-pressed="false" title="Ink (I)"><svg aria-hidden="true"><use href="#i-ink"/></svg><span>Ink</span></button><button type="button" class="ed-tool" data-tool="marker" aria-pressed="false" title="Marker (M)"><svg aria-hidden="true"><use href="#i-marker"/></svg><span>Marker</span></button><button type="button" class="ed-tool" data-tool="text" aria-pressed="false" title="Text (T)"><svg aria-hidden="true"><use href="#i-text"/></svg><span>Text</span></button><button type="button" class="ed-tool" data-tool="erase" aria-pressed="false" title="Eraser (E)"><svg aria-hidden="true"><use href="#i-eraser"/></svg><span>Eraser</span></button></div>
<div class="ed-opts" id="opts-draw"><div class="ed-label"><label for="pen-size">Stroke size</label><output id="size-value" for="pen-size">4</output></div><input id="pen-size" type="range" min="1" max="28" value="4"><svg class="ed-sample" viewBox="0 0 150 56" aria-hidden="true"><path id="stroke-sample" d="M10 28 Q40 10 60 28 T110 24 T140 28"/></svg></div>
<div class="ed-opts" id="opts-text" hidden><div class="ed-label" id="tsize-label">Text size</div><div class="ed-sizes" role="group" aria-labelledby="tsize-label"><button type="button" class="ed-size" data-tsize="28" aria-pressed="false" aria-label="Small text"><span style="font-size:15px">Aa</span><small>S</small></button><button type="button" class="ed-size" data-tsize="40" aria-pressed="false" aria-label="Medium text"><span style="font-size:19px">Aa</span><small>M</small></button><button type="button" class="ed-size" data-tsize="56" aria-pressed="false" aria-label="Large text"><span style="font-size:25px">Aa</span><small>L</small></button><button type="button" class="ed-size" data-tsize="80" aria-pressed="false" aria-label="Extra large text"><span style="font-size:31px">Aa</span><small>E</small></button></div></div>
<div class="ed-opts"><div class="ed-label" id="ink-label">Ink</div><div class="ed-swatches" role="group" aria-labelledby="ink-label"><button type="button" data-color="#594739" class="ed-swatch" aria-label="Cocoa ink" aria-pressed="false" style="--swatch:#594739"></button><button type="button" data-color="#a65f4c" class="ed-swatch" aria-label="Terracotta ink" aria-pressed="false" style="--swatch:#a65f4c"></button><button type="button" data-color="#66745a" class="ed-swatch" aria-label="Moss ink" aria-pressed="false" style="--swatch:#66745a"></button><button type="button" data-color="#bc8b3d" class="ed-swatch" aria-label="Honey ink" aria-pressed="false" style="--swatch:#bc8b3d"></button><button type="button" data-color="#728b98" class="ed-swatch" aria-label="Dusty blue ink" aria-pressed="false" style="--swatch:#728b98"></button></div></div>
<div class="ed-opts"><div class="ed-label" id="paper-label">Paper</div><div class="ed-swatches" role="group" aria-labelledby="paper-label"><button type="button" data-paper="cream" class="ed-swatch ed-paper" aria-label="Oat paper" aria-pressed="false" style="--swatch:#fff6e5"></button><button type="button" data-paper="rose" class="ed-swatch ed-paper" aria-label="Peach paper" aria-pressed="false" style="--swatch:#efd2bd"></button><button type="button" data-paper="sage" class="ed-swatch ed-paper" aria-label="Moss paper" aria-pressed="false" style="--swatch:#dce1c6"></button><button type="button" data-paper="blue" class="ed-swatch ed-paper" aria-label="Blue paper" aria-pressed="false" style="--swatch:#d9e3e2"></button></div></div>
</div>
<div class="ed-main"><div class="ed-sheet" id="ed-sheet">
<div class="ed-bar"><span class="ed-hint" id="tool-hint">Pencil</span><div class="ed-history" role="group" aria-label="History"><button id="undo" class="icon-button" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg aria-hidden="true"><use href="#i-undo"/></svg></button><button id="redo" class="icon-button" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg aria-hidden="true"><use href="#i-redo"/></svg></button></div></div>
<div class="ed-stage" id="stage"><div class="editor-paper cream" id="editor-paper"><canvas id="drawing" width="1000" height="720" aria-label="Page for drawing and writing"></canvas></div>
<div class="ed-textbox" id="text-box" hidden><div class="ed-tbar"><button type="button" class="ed-grip" id="text-grip" aria-label="Move text" title="Drag to move"><svg aria-hidden="true"><use href="#i-grip"/></svg></button><button type="button" class="ed-del" id="text-del" aria-label="Delete text" title="Delete text"><svg aria-hidden="true"><use href="#i-trash"/></svg></button></div><textarea id="text-edit" maxlength="500" rows="1" aria-label="Text" placeholder="Write here…" spellcheck="true"></textarea><span class="ed-resize" id="text-resize" role="slider" tabindex="0" aria-label="Resize text width" title="Drag to resize width"></span></div></div>
<div id="preview-wrap" hidden><p class="preview-label">How it will look on the wall</p><article class="note" id="note-preview"></article></div>
</div></div></div>
<div class="ed-foot"><p class="ed-error" id="post-error" role="alert"></p><p class="ed-help ed-note">Draft stays on this device until you stick it.</p><div class="ed-actions"><button id="preview" class="paper-button" type="button"><svg aria-hidden="true"><use href="#i-preview"/></svg><span>Preview</span></button><button id="post" class="paper-button primary" type="button"><svg aria-hidden="true"><use href="#i-check"/></svg><span>Stick to the wall</span></button></div></div>
</dialog>
<div id="toast" role="status"></div><audio id="music" preload="none" src="assets/coffee.mp3"></audio>
<div id="streak-scene" aria-hidden="true" hidden><img src="assets/fire.svg" alt=""><span></span></div></body></html>
